services:
  app:
    build:
      context: .
      args:
        APP_BUILD: ${APP_BUILD:-dev}
        APP_COMMIT: ${APP_COMMIT:-}
    container_name: it-ticketing-app
    ports:
      - "8080:3000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=${NODE_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Opsional: docker compose --profile s3 up -d minio
  # Lalu isi S3_* di .env (S3_ENDPOINT=http://minio:9000 untuk app di compose, http://localhost:9100 untuk pnpm dev).
  minio:
    # minio/minio di Docker Hub dan Quay sudah tidak tersedia; image Chainguard (distroless, entrypoint minio, user 65532).
    image: cgr.dev/chainguard/minio:latest
    profiles: ["s3"]
    container_name: it-ticketing-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
