services:
  app:
    build:
      context: .
      args:
        APP_BUILD: ${APP_BUILD:-dev}
        APP_COMMIT: ${APP_COMMIT:-}
    container_name: it-ticketing-app
    ports:
      - "8080:3000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=${NODE_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
